name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/independentai_test
  JWT_SECRET: ci-test-secret-ci-test-secret-ci-test-secret-32
  CRON_SECRET: ci-cron-secret-1234567890
  NEXT_PUBLIC_SITE_URL: http://localhost:3200
  IAI_TEST_MODE: '1'
  IAI_ALLOW_MOCK: '1'

jobs:
  quality:
    name: Format · Lint · Typecheck · Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration-build-e2e:
    name: Integration · Build · E2E smoke
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: independentai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/independentai_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/independentai_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Apply migrations to test DB
        run: pnpm db:migrate:deploy
      - name: Integration tests
        run: pnpm test:integration
      - name: Production build
        run: pnpm build
      - name: Install Playwright browsers
        run: pnpm --filter @independentai/web exec playwright install --with-deps chromium
      - name: E2E smoke
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
